openapi: 3.1.0
info:
  title: New Talents Player Passport Lifecycle API
  version: 0.2.0
  description: >-
    Authenticated Feature 005 contract. Colombia/18 age decisions and every
    authorization decision are made by the backend. Protected responses are
    non-cacheable and never use document knowledge, payment, creator identity,
    historical TUTOR role, or client-declared adulthood as authority.
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /passport-representation-confirmations:
    post:
      operationId: createPassportRepresentationConfirmation
      summary: Confirm a USER's authority for an academy-created minor
      description: >-
        The authenticated representative creates a 24-hour, single-use
        confirmation bound to the prospective player's normalized-document
        fingerprint. An academy employee cannot perform this confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRepresentationConfirmationRequest'
      responses:
        '201':
          $ref: '#/components/responses/RepresentationConfirmationCreated'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
  /passports:
    get:
      operationId: listAccessiblePassports
      summary: List passports for one explicit authorized context
      parameters:
        - name: context
          in: query
          required: true
          schema:
            type: string
            enum: [PARTICULAR, ACADEMY]
        - name: academyId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Required only for ACADEMY context.
      responses:
        '200':
          $ref: '#/components/responses/PassportList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
  /passports/drafts:
    post:
      operationId: createPassportDraft
      summary: Atomically create the first passport draft and responsibilities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraftRequest'
      responses:
        '201':
          $ref: '#/components/responses/DraftCreated'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /passports/{passportId}:
    parameters:
      - $ref: '#/components/parameters/PassportId'
    get:
      operationId: getPassportStatus
      summary: Get the authorized lifecycle status and capabilities
      responses:
        '200':
          $ref: '#/components/responses/PassportStatus'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PassportNotFound'
  /passports/{passportId}/presentation:
    parameters:
      - $ref: '#/components/parameters/PassportId'
    get:
      operationId: getPassportPresentation
      summary: Get the sports-presentation contract without private identity data
      responses:
        '200':
          $ref: '#/components/responses/PassportPresentation'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PassportNotFound'
  /passports/{passportId}/draft:
    parameters:
      - $ref: '#/components/parameters/PassportId'
    get:
      operationId: getEditablePassportDraft
      summary: Get private editable draft data for an authorized manager
      responses:
        '200':
          $ref: '#/components/responses/EditableDraft'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PassportNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      operationId: updatePassportDraft
      summary: Update authorized editable private/profile data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditDraftRequest'
      responses:
        '200':
          $ref: '#/components/responses/DraftUpdated'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PassportNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /passports/{passportId}/submit:
    parameters:
      - $ref: '#/components/parameters/PassportId'
    post:
      operationId: submitPassport
      summary: Submit a valid draft or returned passport for review
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          $ref: '#/components/responses/PassportStatus'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PassportNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /passports/{passportId}/return:
    parameters:
      - $ref: '#/components/parameters/PassportId'
    post:
      operationId: returnPassportForCorrection
      summary: Return an in-review passport with a creator-safe reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnRequest'
      responses:
        '200':
          $ref: '#/components/responses/PassportStatus'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PassportNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /passports/{passportId}/possible-duplicate/resolve:
    parameters:
      - $ref: '#/components/parameters/PassportId'
    post:
      operationId: resolvePossibleDuplicate
      summary: Resolve a private duplicate signal as an authorized Analyst
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveDuplicateRequest'
      responses:
        '200':
          $ref: '#/components/responses/InternalPassportStatus'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PassportNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /passports/{passportId}/approve:
    parameters:
      - $ref: '#/components/parameters/PassportId'
    post:
      operationId: approvePassport
      summary: Approve an in-review passport with no unresolved duplicate signal
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          $ref: '#/components/responses/InternalPassportStatus'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PassportNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /passports/{passportId}/activate:
    parameters:
      - $ref: '#/components/parameters/PassportId'
    post:
      operationId: activatePassport
      summary: Manually activate an approved passport
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          $ref: '#/components/responses/InternalPassportStatus'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PassportNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /passports/{passportId}/history:
    parameters:
      - $ref: '#/components/parameters/PassportId'
    get:
      operationId: getPassportHistory
      summary: Get ordinary history filtered for a particular or academy manager
      description: Possible-duplicate detection and resolution are structurally absent.
      responses:
        '200':
          $ref: '#/components/responses/PassportHistory'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PassportNotFound'
  /passports/{passportId}/internal-history:
    parameters:
      - $ref: '#/components/parameters/PassportId'
    get:
      operationId: getPassportInternalHistory
      summary: Get capability-gated immutable internal lifecycle history
      responses:
        '200':
          $ref: '#/components/responses/InternalPassportHistory'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PassportNotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PassportId:
      name: passportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    DocumentIdentityInput:
      type: object
      additionalProperties: false
      required: [documentType, documentNumber]
      properties:
        documentType:
          type: string
          minLength: 1
          maxLength: 40
        documentNumber:
          type: string
          minLength: 1
          maxLength: 80
    FootballProfileInput:
      type: object
      additionalProperties: false
      required: [primaryPosition, declaredAgeCategory, city, country, dominantFoot]
      properties:
        primaryPosition: { type: string, minLength: 1, maxLength: 80 }
        declaredAgeCategory: { type: string, minLength: 1, maxLength: 40 }
        city: { type: string, minLength: 1, maxLength: 100 }
        country: { type: string, minLength: 1, maxLength: 100 }
        dominantFoot:
          $ref: '#/components/schemas/DominantFoot'
    RepresentativeIdentityInput:
      type: object
      additionalProperties: false
      required: [legalName, documentType, documentNumber, relationship, authorityConfirmed]
      properties:
        legalName: { type: string, minLength: 1, maxLength: 200 }
        documentType: { type: string, minLength: 1, maxLength: 40 }
        documentNumber: { type: string, minLength: 1, maxLength: 80 }
        relationship:
          type: string
          enum: [MOTHER, FATHER, LEGAL_GUARDIAN]
        authorityConfirmed:
          type: boolean
          const: true
    CreateRepresentationConfirmationRequest:
      type: object
      additionalProperties: false
      required: [playerDocument, representative]
      properties:
        playerDocument:
          $ref: '#/components/schemas/DocumentIdentityInput'
        representative:
          $ref: '#/components/schemas/RepresentativeIdentityInput'
    RepresentationConfirmationResponse:
      type: object
      additionalProperties: false
      required: [confirmationId, expiresAt]
      properties:
        confirmationId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
    CreateDraftRequest:
      type: object
      additionalProperties: false
      required:
        - managementContext
        - playerLegalName
        - dateOfBirth
        - playerDocument
        - footballProfile
      properties:
        managementContext:
          type: string
          enum: [SELF, LEGAL_REPRESENTATIVE, ACADEMY]
        academyId:
          type: string
          format: uuid
          description: Required only for ACADEMY.
        playerLegalName: { type: string, minLength: 1, maxLength: 200 }
        dateOfBirth: { type: string, format: date }
        playerDocument:
          $ref: '#/components/schemas/DocumentIdentityInput'
        footballProfile:
          $ref: '#/components/schemas/FootballProfileInput'
        representative:
          allOf:
            - $ref: '#/components/schemas/RepresentativeIdentityInput'
          description: Required when a USER creates in LEGAL_REPRESENTATIVE context.
        representativeConfirmationId:
          type: string
          format: uuid
          description: Required for an academy-created minor; forbidden otherwise.
      description: >-
        The server derives age. SELF is valid only for an adult and is bound to
        the authenticated USER. LEGAL_REPRESENTATIVE is valid only for a minor.
        ACADEMY requires active membership and, for a minor, a valid confirmation.
    EditDraftRequest:
      type: object
      additionalProperties: false
      properties:
        playerLegalName: { type: string, minLength: 1, maxLength: 200 }
        dateOfBirth: { type: string, format: date }
        playerDocument:
          $ref: '#/components/schemas/DocumentIdentityInput'
        footballProfile:
          $ref: '#/components/schemas/FootballProfileInput'
        expectedVersion: { type: integer, minimum: 1 }
      minProperties: 1
      description: Any age/relationship incompatibility rejects the whole update.
    VersionRequest:
      type: object
      additionalProperties: false
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    ReturnRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
        expectedVersion: { type: integer, minimum: 1 }
    ResolveDuplicateRequest:
      type: object
      additionalProperties: false
      required: [resolution]
      properties:
        resolution:
          type: string
          enum: [DIFFERENT_PLAYER, RETURN_FOR_CORRECTION, CONFIRMED_EXISTING]
        creatorSafeReason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Required only for RETURN_FOR_CORRECTION; never names a candidate.
        expectedVersion: { type: integer, minimum: 1 }
    PassportLifecycleState:
      type: string
      enum: [DRAFT, IN_REVIEW, RETURNED_FOR_CORRECTION, APPROVED, ACTIVE]
    DominantFoot:
      type: string
      enum: [LEFT, RIGHT, BOTH, UNDECLARED]
    PassportAction:
      type: string
      enum: [VIEW, EDIT, SUBMIT, RETURN, RESOLVE_DUPLICATE, APPROVE, ACTIVATE, VIEW_HISTORY, VIEW_INTERNAL_HISTORY]
    PassportCollectionAction:
      type: string
      enum: [CREATE_SELF, CREATE_REPRESENTED_MINOR, CREATE_ACADEMY, VIEW_PARTICULAR_SELECTOR, VIEW_ACADEMY_PORTFOLIO]
    PassportSummaryResponse:
      type: object
      additionalProperties: false
      required: [passportId, displayName, lifecycleState, origin, availableActions]
      properties:
        passportId: { type: string, format: uuid }
        displayName: { type: string }
        lifecycleState:
          $ref: '#/components/schemas/PassportLifecycleState'
        origin:
          type: string
          enum: [PARTICULAR, ACADEMY, HISTORICAL_TUTOR]
        academyOriginName:
          type: [string, 'null']
        availableActions:
          type: array
          items:
            $ref: '#/components/schemas/PassportAction'
    PassportListResponse:
      type: object
      additionalProperties: false
      required: [context, passports, collectionActions]
      properties:
        context:
          type: string
          enum: [PARTICULAR, ACADEMY]
        passports:
          type: array
          items:
            $ref: '#/components/schemas/PassportSummaryResponse'
        collectionActions:
          type: array
          items:
            $ref: '#/components/schemas/PassportCollectionAction'
    PassportStatusResponse:
      type: object
      additionalProperties: false
      required: [passportId, displayName, lifecycleState, origin, availableActions, version, ageSensitiveMutationAvailability]
      properties:
        passportId: { type: string, format: uuid }
        displayName: { type: string }
        lifecycleState:
          $ref: '#/components/schemas/PassportLifecycleState'
        origin:
          type: string
          enum: [PARTICULAR, ACADEMY, HISTORICAL_TUTOR]
        academyOriginName:
          type: [string, 'null']
        availableActions:
          type: array
          items:
            $ref: '#/components/schemas/PassportAction'
        version: { type: integer, minimum: 1 }
        correctionReason: { type: [string, 'null'] }
        ageSensitiveMutationAvailability:
          type: string
          enum: [AVAILABLE, NOT_AVAILABLE]
    InternalPassportStatusResponse:
      type: object
      additionalProperties: false
      required: [passportId, displayName, lifecycleState, origin, availableActions, version, ageSensitiveMutationAvailability, possibleDuplicate]
      properties:
        passportId: { type: string, format: uuid }
        displayName: { type: string }
        lifecycleState:
          $ref: '#/components/schemas/PassportLifecycleState'
        origin:
          type: string
          enum: [PARTICULAR, ACADEMY, HISTORICAL_TUTOR]
        academyOriginName:
          type: [string, 'null']
        availableActions:
          type: array
          items:
            $ref: '#/components/schemas/PassportAction'
        version: { type: integer, minimum: 1 }
        correctionReason: { type: [string, 'null'] }
        ageSensitiveMutationAvailability:
          type: string
          enum: [AVAILABLE, NOT_AVAILABLE]
        possibleDuplicate:
          type: string
          enum: [NONE, UNRESOLVED, RESOLVED_DIFFERENT, RETURNED_FOR_CORRECTION, CONFIRMED_EXISTING]
    EditableDraftResponse:
      type: object
      additionalProperties: false
      required: [passportId, playerLegalName, dateOfBirth, playerDocument, footballProfile, lifecycleState, version]
      properties:
        passportId: { type: string, format: uuid }
        playerLegalName: { type: string }
        dateOfBirth: { type: string, format: date }
        playerDocument:
          $ref: '#/components/schemas/DocumentIdentityInput'
        footballProfile:
          $ref: '#/components/schemas/FootballProfileInput'
        lifecycleState:
          $ref: '#/components/schemas/PassportLifecycleState'
        version: { type: integer, minimum: 1 }
      description: Private contract; never used by sports presentation or ordinary history.
    PresentationValue:
      type: object
      additionalProperties: false
      required: [availability]
      properties:
        availability:
          type: string
          enum: [AVAILABLE, EMPTY, UNAVAILABLE, RESTRICTED, FUTURE_DEPENDENCY]
        value:
          type: [string, 'null']
    PlayerIdentityPresentation:
      type: object
      additionalProperties: false
      required: [displayName, primaryPosition, declaredAgeCategory, city, country, dominantFoot, academyOrigin, photograph]
      properties:
        displayName: { type: string }
        primaryPosition:
          $ref: '#/components/schemas/PresentationValue'
        declaredAgeCategory:
          $ref: '#/components/schemas/PresentationValue'
        city:
          $ref: '#/components/schemas/PresentationValue'
        country:
          $ref: '#/components/schemas/PresentationValue'
        dominantFoot:
          $ref: '#/components/schemas/PresentationValue'
        academyOrigin:
          $ref: '#/components/schemas/PresentationValue'
        photograph:
          type: object
          additionalProperties: false
          required: [state]
          properties:
            state:
              type: string
              const: NEUTRAL_LOCAL_PLACEHOLDER
    PassportSectionPresentation:
      type: object
      additionalProperties: false
      required: [section, availability]
      properties:
        section:
          type: string
          enum: [SUMMARY, STATISTICS, MATCHES, VIDEOS]
        availability:
          type: string
          enum: [AVAILABLE, EMPTY, UNAVAILABLE, RESTRICTED, FUTURE_DEPENDENCY]
        dependency:
          type: [string, 'null']
          enum: [null, STATISTICS_FEM, MATCHES, AUDIOVISUAL]
    PassportPresentationResponse:
      type: object
      additionalProperties: false
      required: [passportId, lifecycleState, identity, sections]
      properties:
        passportId: { type: string, format: uuid }
        lifecycleState:
          $ref: '#/components/schemas/PassportLifecycleState'
        identity:
          $ref: '#/components/schemas/PlayerIdentityPresentation'
        sections:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/PassportSectionPresentation'
    OrdinaryLifecycleEventResponse:
      type: object
      additionalProperties: false
      required: [eventId, action, occurredAt, outcome]
      properties:
        eventId: { type: string, format: uuid }
        action:
          type: string
          enum: [CREATED, MATERIAL_UPDATED, SUBMITTED, RETURNED_FOR_CORRECTION, RESUBMITTED, APPROVED, ACTIVATED]
        occurredAt: { type: string, format: date-time }
        outcome: { type: string, enum: [SUCCEEDED, REJECTED] }
        previousState:
          oneOf:
            - $ref: '#/components/schemas/PassportLifecycleState'
            - type: 'null'
        resultingState:
          oneOf:
            - $ref: '#/components/schemas/PassportLifecycleState'
            - type: 'null'
        creatorSafeReason: { type: [string, 'null'] }
    InternalLifecycleEventResponse:
      type: object
      additionalProperties: false
      required: [eventId, action, occurredAt, outcome, actorIdentityId]
      properties:
        eventId: { type: string, format: uuid }
        action:
          type: string
          enum: [CREATED, RELATIONSHIP_ESTABLISHED, REPRESENTATION_CONFIRMED, MATERIAL_UPDATED, SUBMITTED, RETURNED_FOR_CORRECTION, RESUBMITTED, POSSIBLE_DUPLICATE_DETECTED, POSSIBLE_DUPLICATE_RESOLVED, APPROVED, ACTIVATED, HISTORICAL_RESPONSIBILITY_RECONCILED]
        occurredAt: { type: string, format: date-time }
        outcome: { type: string, enum: [SUCCEEDED, REJECTED] }
        actorIdentityId: { type: string, format: uuid }
        previousState:
          oneOf:
            - $ref: '#/components/schemas/PassportLifecycleState'
            - type: 'null'
        resultingState:
          oneOf:
            - $ref: '#/components/schemas/PassportLifecycleState'
            - type: 'null'
        safeInternalResult: { type: [string, 'null'] }
    PassportHistoryResponse:
      type: object
      additionalProperties: false
      required: [passportId, events]
      properties:
        passportId: { type: string, format: uuid }
        events:
          type: array
          items:
            $ref: '#/components/schemas/OrdinaryLifecycleEventResponse'
    InternalPassportHistoryResponse:
      type: object
      additionalProperties: false
      required: [passportId, events]
      properties:
        passportId: { type: string, format: uuid }
        events:
          type: array
          items:
            $ref: '#/components/schemas/InternalLifecycleEventResponse'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
  responses:
    RepresentationConfirmationCreated:
      description: Private confirmation created by the representative.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RepresentationConfirmationResponse'
    PassportList:
      description: Context-scoped list.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PassportListResponse'
    DraftCreated:
      description: Draft and required relationships created atomically.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PassportStatusResponse'
    EditableDraft:
      description: Authorized private editable data.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EditableDraftResponse'
    DraftUpdated:
      description: Draft updated atomically.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PassportStatusResponse'
    PassportPresentation:
      description: Authorized sports presentation without private identity or representation facts.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PassportPresentationResponse'
    PassportStatus:
      description: Authorized ordinary status.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PassportStatusResponse'
    InternalPassportStatus:
      description: Authorized internal status.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalPassportStatusResponse'
    PassportHistory:
      description: Ordinary history with all duplicate-review events omitted.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PassportHistoryResponse'
    InternalPassportHistory:
      description: Capability-gated immutable internal history without raw sensitive values.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalPassportHistoryResponse'
    InvalidRequest:
      description: Invalid or inconsistent input.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AuthenticationFailed:
      description: Missing, invalid or inactive authenticated identity/session.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Generic denial without protected-resource confirmation.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PassportNotFound:
      description: Generic unavailable response that does not distinguish absence from protected existence.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Duplicate, stale version, invalid lifecycle state, expired/used confirmation or age-authority conflict; no protected details.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  headers:
    NoStore:
      description: Protected responses are not cacheable.
      schema:
        type: string
        const: no-store
